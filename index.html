<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>برجر هاوس</title>
<style>
:root{--bg:#fff8f0;--card:#fff;--text:#2b1d12;--muted:#7a6a5c;--brand:#e8452c;--b2:#ffb703;--line:#f0e2d2;--ok:#2a9d5c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1511;--card:#2a2019;--text:#f6ece2;--muted:#b8a595;--line:#3d2f25}}
:root[data-theme="dark"]{--bg:#1c1511;--card:#2a2019;--text:#f6ece2;--muted:#b8a595;--line:#3d2f25}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.5}
header{background:linear-gradient(135deg,var(--brand),#ff7a2f);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:21px}header button{background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:8px;padding:6px 10px;margin-inline-start:6px;cursor:pointer;font-family:inherit}
.tabs{display:flex;gap:6px;padding:10px 12px 0;max-width:960px;margin:auto;overflow-x:auto}
.tab{flex:0 0 auto;padding:8px 12px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;font-size:14px;cursor:pointer;font-family:inherit;white-space:nowrap}
.tab.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.bd{background:var(--b2);color:#000;border-radius:10px;padding:0 7px;margin-inline-start:5px;font-size:12px}
main{max-width:960px;margin:auto;padding:12px 16px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;position:relative}
.grid .card{margin:0;cursor:pointer;overflow:hidden}.em{font-size:46px;text-align:center}
.ph{display:block;width:calc(100% + 24px);margin:-12px -12px 8px;aspect-ratio:4/3;object-fit:cover;background:var(--line)}
#modal .ph{width:100%;margin:0 0 8px;border-radius:12px}
.card h3{margin:4px 0 2px;font-size:16px}.card p{margin:0;color:var(--muted);font-size:13px}
.pr{font-weight:700;color:var(--brand)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;flex-wrap:wrap}
.stars span{cursor:pointer;font-size:20px;color:#ccc}.stars span.f{color:var(--b2)}
.avg{font-size:12px;color:var(--muted)}
.btn{background:var(--brand);color:#fff;border:0;border-radius:10px;padding:8px 14px;font-size:14px;cursor:pointer;font-family:inherit}
.btn.g{background:var(--ok)}.btn.o{background:transparent;color:var(--brand);border:1px solid var(--brand)}.btn.s{padding:4px 10px;font-size:13px}
.qty{display:flex;align-items:center;gap:8px}.qty button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:17px;cursor:pointer}
input,textarea,select{width:100%;padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font-size:15px;font-family:inherit;margin-top:6px}
input[type=checkbox]{width:auto;margin:0 6px}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:8px}.chip{flex:0 0 auto;padding:5px 12px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;font-family:inherit}.chip.on{background:var(--b2);color:#000}
.promo{background:linear-gradient(90deg,var(--b2),#ffd166);color:#000;border-radius:12px;padding:8px 12px;margin-bottom:8px;font-weight:600}
.av{position:absolute;top:8px;inset-inline-start:8px;background:var(--ok);color:#fff;border-radius:8px;padding:0 8px;font-size:12px;z-index:1}
.card.off{opacity:.65}.card.off .ph{filter:grayscale(1)}
.th{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--line);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:30px}
.pv{display:block;width:100%;max-height:180px;object-fit:cover;border-radius:12px;margin-top:6px;background:var(--line)}
.so{position:absolute;z-index:1;top:8px;inset-inline-start:8px;background:#444;color:#fff;border-radius:8px;padding:0 8px;font-size:12px}
.heart{position:absolute;top:6px;inset-inline-end:10px;font-size:20px;cursor:pointer}
.st{display:inline-block;padding:2px 10px;border-radius:10px;font-size:12px;background:var(--b2);color:#000}.st.s1,.st.s2{background:#8ecae6}.st.s3{background:#cdb4db}.st.s4{background:#a7e3b9}.st.s-1{background:#f4a6a0}
.muted{color:var(--muted);font-size:13px}h2{font-size:18px;margin:16px 0 6px}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);inset-inline:12px;z-index:60;background:var(--ok);color:#fff;padding:10px 14px;border-radius:12px;text-align:center}.toast.err{background:#c0392b}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:12px}
#modal>div{background:var(--card);border-radius:16px;padding:16px;max-width:460px;width:100%;max-height:90%;overflow:auto}
.fl{display:block;font-size:13px;color:var(--muted);margin-top:6px}
.bar{height:10px;background:var(--brand);border-radius:5px}
@media print{body>*:not(#modal){display:none!important}#modal{position:static;background:none}.noprint{display:none}}
</style>
</head>

function API(p,o){o=o||{};return fetch("/api/"+p,Object.assign({},o,{headers:{"content-type":"application/json","x-cid":CID,"x-token":TOKEN}})).then(async r=>{const j=await r.json().catch(()=>({}));if(!r.ok)throw{code:r.status,message:j.error||""};return j})}
const snapDoc=(id,x)=>({id,exists:!!x,data:()=>x?JSON.parse(JSON.stringify(x)):undefined});
function poll(f,n,e){let last=null,stop=false;const run=async()=>{if(stop)return;try{const s=await f();const k=JSON.stringify(s.docs?s.docs.map(d=>[d.id,d.data()]):[s.exists,s.data()]);if(k!==last){last=k;n(s)}}catch(x){if(e&&last===null)e(x)}if(!stop)setTimeout(run,document.hidden?15000:POLL)};run();return()=>{stop=true}}
function mkDoc(path){const id=path.split("/").pop(),u="doc?path="+enc(path);return{id,path,
 get:async()=>{const j=await API(u);return snapDoc(id,j.exists?j.data:null)},
 set:d=>API(u,{method:"PUT",body:JSON.stringify(d)}),update:d=>API(u,{method:"PATCH",body:JSON.stringify(d)}),delete:()=>API(u,{method:"DELETE"}),
 onSnapshot:(n,e)=>poll(()=>mkDoc(path).get(),n,e)}}
function mkCol(path){return{path,doc:id=>mkDoc(path+"/"+(id||rid())),get:async()=>{const j=await API("col?path="+enc(path));return{docs:j.docs.map(d=>snapDoc(d.id,d.data))}},onSnapshot:(n,e)=>poll(()=>mkCol(path).get(),n,e)}}
const DB={doc:mkDoc,collection:mkCol};
let offO=null;
function subOrders(){if(offO)return;offO=DB.collection("orders").onSnapshot(s=>{const l=[];s.docs.forEach(d=>((d.data().orders)||[]).forEach(o=>l.push(Object.assign({u:d.id},o))));l.sort((a,b)=>b.ts-a.ts);
 if(seen){const nw=l.filter(o=>!seen.has(o.id));if(nw.length){beep();toast("🔔 "+nw[0].name+" — "+money(nw[0].total))}}seen=new Set(l.map(o=>o.id));sOrders=l;refresh()},er)}
function sellerBtn(){$("#bk").textContent=canSell?"🚪":"🔑"}
$("#bk").onclick=()=>{
 if(canSell){API("logout",{method:"POST"}).catch(er);TOKEN="";try{localStorage.removeItem("tk")}catch(e){}canSell=false;sOrders=[];seen=null;if(offO){offO();offO=null}view="home";sellerBtn();render();return}
 formModal("🔑",[{k:"p",l:"كود البائع / Code vendeur",type:"password"}],async o=>{try{const j=await API("login",{method:"POST",body:JSON.stringify({password:o.p})});TOKEN=j.token;try{localStorage.setItem("tk",TOKEN)}catch(e){}canSell=true;subOrders();view="seller";sellerBtn();render()}catch(e){toast(e.code===429?"⏳":"❌",1)}})}
db=DB;uid=CID;canWrite=true;render();
(async()=>{
 if(TOKEN){try{const m=await API("me");canSell=!!m.seller;if(!canSell){TOKEN="";try{localStorage.removeItem("tk")}catch(e){}}}catch(e){}}
 sellerBtn();
 DB.collection("menu").onSnapshot(s=>{menu=rows(s);refresh()},er);
 DB.collection("zones").onSnapshot(s=>{zones=rows(s);refresh()},er);
 DB.collection("coupons").onSnapshot(s=>{coupons=rows(s);refresh()},er);
 DB.collection("ratings").onSnapshot(s=>{ratings={};s.docs.forEach(d=>ratings[d.id]=d.data());refresh()},er);
 DB.doc("data/users/"+uid+"/prefs").onSnapshot(s=>{if(s.exists){prefs=Object.assign({fav:[],profile:{}},s.data());const p=prefs.profile||{};form.name=form.name||p.name||"";form.phone=form.phone||p.phone||"";form.addr=form.addr||p.addr||""}refresh()},er);
 DB.doc("orders/"+uid).onSnapshot(s=>{myOrders=(s.exists&&s.data().orders)||[];if(prevSt){myOrders.forEach(o=>{if(prevSt[o.id]!==undefined&&prevSt[o.id]!==o.status)toast("📦 #"+o.id+": "+t("s"+o.status))})}prevSt={};myOrders.forEach(o=>prevSt[o.id]=o.status);refresh()},er);
 if(canSell)subOrders();
 render();
})();
</script>
</body>
</html>
